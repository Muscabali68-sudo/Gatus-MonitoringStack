name: Build and Push

on:
  workflow_dispatch: # Startas manuellt via en knapp på GitHub

jobs:
  build-push:
    name: Build and push Gatus image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: eu-central-1
      ECR_REPOSITORY: gatus-app-repo
      IMAGE_TAG: ${{ github.sha }} # Hämtar hashen för den commit du valt att köra på

    steps:
      - name: Check out validated code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.IMAGE_TAG }}
          persist-credentials: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: arn:aws:iam::244306245751:role/github-actions-build-push-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-build-push

      - name: Log in to Amazon ECR 
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Check whether image exists
        id: check-image
        shell: bash
        run: |
          if result=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists. We will reuse it."
          elif [[ "$result" == *"ImageNotFoundException"* ]]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist. We will build it."
          else
            echo "$result"
            exit 1
          fi

      - name: Build and push Gatus image
        if: steps.check-image.outputs.exists == 'false'
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --platform linux/arm64 --tag "$IMAGE_URI" ./gatus
          docker push "$IMAGE_URI" 


